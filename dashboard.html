<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SG Dashboard</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="style.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6fb;
    color: #222;
    transition: 0.3s;
}

.dashboard {
    display: flex;
    min-height: 100vh;
}


/* SIDEBAR */

.sidebar {
    width: 250px;
    min-height: 100vh;
    background: rgb(87, 87, 228);
    padding: 30px 18px;
    transition: 0.3s;
}

.logo {
    color: white;
    font-size: 35px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 50px;
}

.logo span {
    color: #ff641e;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.menu a {
    text-decoration: none;
    color: white;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 15px;
    border-radius: 10px;
    transition: 0.3s;
}

.menu a i {
    width: 25px;
    font-size: 19px;
}

.menu a:hover,
.menu a.active {
    background: rgba(255, 255, 255, 0.2);
}


/* CONTENT */

.content {
    flex: 1;
    padding: 25px 35px;
}


/* TOPBAR */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

.top-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.top-left h1 {
    font-size: 30px;
}

.top-left p {
    color: #777;
    margin-top: 5px;
}

.menu-btn {
    display: none;
    border: none;
    background: none;
    font-size: 25px;
    cursor: pointer;
}

.top-right {
    display: flex;
    align-items: center;
    gap: 18px;
}


/* SEARCH */

.search {
    background: white;
    width: 260px;
    height: 45px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 10px;
    border: 1px solid #eee;
}

.search i {
    color: #777;
}

.search input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 14px;
}


/* DARK BUTTON */

.dark-btn {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 10px;
    background: white;
    cursor: pointer;
    font-size: 19px;
    
}
body.dark .post-form textarea {
    background: #1f2937;
    color: white;
    border-color: #374151;
}

.profile {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
}

.profile i {
    color: rgb(87, 87, 228);
    font-size: 35px;
}


/* CARDS */

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 35px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
}

.card p {
    color: #777;
    font-size: 14px;
    margin-bottom: 7px;
}

.card h2 {
    font-size: 25px;
}

.card-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 21px;
}

.blue {
    background: #5757e4;
}

.orange {
    background: #ff641e;
}

.green {
    background: #20b26b;
}

.purple {
    background: #8b5cf6;
}


/* BLOG */

.blog-section {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.section-header h2 {
    margin-bottom: 5px;
}

.section-header p {
    color: #777;
}


/* ADD BUTTON */

.add-btn {
    border: none;
    background: rgb(87, 87, 228);
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.add-btn:hover {
    opacity: 0.9;
}


/* FORM */

.post-form {
    display: none;
    background: #f7f8fc;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.post-form.show {
    display: block;
}

.post-form h3 {
    margin-bottom: 15px;
}

.post-form input,
.post-form textarea,
.post-form select {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 7px;
    padding: 12px;
    margin-bottom: 12px;
    outline: none;
    background: white;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
}

.post-form input,
.post-form select {
    height: 45px;
}

.post-form textarea {
    min-height: 150px;
    resize: vertical;
}


.form-buttons {
    display: flex;
    gap: 10px;
}

.save-btn,
.cancel-btn {
    border: none;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
}

.save-btn {
    background: rgb(87, 87, 228);
    color: white;
}

.cancel-btn {
    background: #ddd;
}


/* TABLE */

.table-container {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 16px 12px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    color: #777;
    font-size: 14px;
}

td {
    font-size: 14px;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
}

.published {
    background: #dcfce7;
    color: #15803d;
}

.draft {
    background: #fef3c7;
    color: #a16207;
}


/* ACTION BUTTONS */

.edit-btn,
.delete-btn {
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 5px;
}

.logout-menu {
    width: 100%;
    border: none;
    background: transparent;
    color: white;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    text-align: left;
}

.logout-menu:hover {
    background: rgba(255, 255, 255, 0.2);
}

.logout-menu i {
    width: 25px;
    font-size: 19px;
}




.edit-btn {
    background: #e0e7ff;
    color: #4338ca;
}

.delete-btn {
    background: #fee2e2;
    color: #dc2626;
}


/* DARK MODE */

body.dark {
    background: #111827;
    color: white;
}

body.dark .content {
    color: white;
}

body.dark .card,
body.dark .blog-section {
    background: #1f2937;
}

body.dark .search,
body.dark .dark-btn {
    background: #1f2937;
    color: white;
}

body.dark .search input {
    background: transparent;
    color: white;
}

body.dark .search input::placeholder {
    color: #aaa;
}

body.dark .post-form {
    background: #111827;
}

body.dark .post-form input,
body.dark .post-form select {
    background: #1f2937;
    color: white;
    border-color: #374151;
}

body.dark th,
body.dark td {
    border-color: #374151;
}

body.dark .top-left p,
body.dark .section-header p,
body.dark .card p {
    color: #aaa;
}


/* MOBILE */

@media (max-width: 1000px) {

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .sidebar {
        width: 210px;
    }

    .search {
        width: 200px;
    }
}


@media (max-width: 700px) {

    .sidebar {
        position: fixed;
        left: -250px;
        top: 0;
        z-index: 1000;
        transition: 0.3s;
    }

    .sidebar.show {
        left: 0;
    }

    .content {
        width: 100%;
        padding: 20px;
    }

    .menu-btn {
        display: block;
    }

    .topbar {
        align-items: flex-start;
    }

    .top-right {
        gap: 8px;
    }

    .profile span {
        display: none;
    }

    .search {
        width: 150px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .section-header {
        align-items: flex-start;
        gap: 15px;
    }
}


@media (max-width: 500px) {

    .topbar {
        flex-direction: column;
        gap: 20px;
    }

    .top-right {
        width: 100%;
    }

    .search {
        flex: 1;
    }

    .section-header {
        flex-direction: column;
    }

    .add-btn {
        width: 100%;
    }

    .blog-section {
        padding: 15px;
    }
}
    </style>
</head>

<body>

<div class="dashboard">

   <!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

    <div class="logo">
        <span>S</span>G
    </div>


    <nav class="menu">

        <!-- Dashboard -->
        <a href="dashboard.html" class="active">
            <i class="fa fa-dashboard"></i>
            <span>Dashboard</span>
        </a>


        <!-- Users -->
        <a href="users.html">
            <i class="fa fa-user"></i>
            <span>Users</span>
        </a>


        <!-- Blog -->
        <a href="blog.html">
            <i class="fa fa-book"></i>
            <span>Blog</span>
        </a>


        <!-- Analytics -->
        <a href="analytics.html">
            <i class="fa fa-bar-chart"></i>
            <span>Analytics</span>
        </a>


        <!-- Settings -->
        <a href="settings.html">
            <i class="fa fa-cog"></i>
            <span>Settings</span>
        </a>


        <!-- Logout -->
        <a href="#" id="logout-btn" class="logout-menu">
            <i class="fa fa-sign-out"></i>
            <span>Logout</span>
        </a>

    </nav>

</aside>

    <!-- MAIN -->
    <main class="content">

        <!-- TOPBAR -->
        <header class="topbar">

            <div class="top-left">

                <button class="menu-btn" id="menuBtn">
                    <i class="fa fa-bars"></i>
                </button>

                <div>
                    <h1>Dashboard</h1>
                  <h2>Welcome back, <span id="user-name">User</span> 👋</h2>
<p id="user-email"></p>
                </div>

            </div>


            <div class="top-right">

                <!-- SEARCH -->
                <div class="search">
                    <i class="fa fa-search"></i>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search posts..."
                    >
                </div>

                <!-- DARK MODE -->
                <button class="dark-btn" id="darkBtn">
                    <i class="fa fa-moon-o"></i>
                </button>


                <div class="profile">
                    <i class="fa fa-user-circle"></i>
                    <span>Sergio</span>
                </div>

            </div>

        </header>


        <!-- CARDS -->
        <section class="cards">

            <div class="card">

                <div class="card-icon blue">
                    <i class="fa fa-users"></i>
                </div>

                <div>
                    <p>Total Users</p>
                    <h2 id="userCount">120</h2>
                </div>

            </div>


            <div class="card">

                <div class="card-icon orange">
                    <i class="fa fa-file-text"></i>
                </div>

                <div>
                    <p>Total Posts</p>
                    <h2 id="postCount">0</h2>
                </div>

            </div>


            <div class="card">

                <div class="card-icon green">
                    <i class="fa fa-eye"></i>
                </div>

                <div>
                    <p>Total Views</p>
                    <h2>1,250</h2>
                </div>

            </div>


            <div class="card">

                <div class="card-icon purple">
                    <i class="fa fa-comments"></i>
                </div>

                <div>
                    <p>Comments</p>
                    <h2>48</h2>
                </div>

            </div>

        </section>


        <!-- BLOG SECTION -->
        <section class="blog-section">

            <div class="section-header">

                <div>
                    <h2>Blog Posts</h2>
                    <p>Manage your latest articles</p>
                </div>

                <button class="add-btn" id="addBtn">
                    <i class="fa fa-plus"></i>
                    Add Post
                </button>

            </div>


         <form class="post-form" id="postForm">

    <h3 id="formTitle">Add New Post</h3>

    <input
        type="text"
        id="postTitle"
        placeholder="Post title"
        required
    >

    <textarea
        id="postContent"
        placeholder="Write your post content..."
        rows="8"
        required
    ></textarea>

    <input
        type="text"
        id="postAuthor"
        placeholder="Author"
        required
    >

    <select id="postStatus">
        <option value="Published">Published</option>
        <option value="Draft">Draft</option>
    </select>

    <div class="form-buttons">

        <button type="submit" id="saveBtn" class="save-btn">
            Save Post
        </button>

        <button type="button" id="cancelBtn" class="cancel-btn">
            Cancel
        </button>

    </div>

</form>

            <!-- TABLE -->
            <div class="table-container">

                <table>

                   <thead>
    <tr>
        <th>#</th>
        <th>Title</th>
        <th>Content</th>
        <th>Author</th>
        <th>Status</th>
        <th>Date</th>
        <th>Actions</th>
    </tr>
</thead>

                    <tbody id="postTable">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
