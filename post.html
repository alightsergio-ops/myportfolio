<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Post</title>

   <style>
    .read-more {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 18px;
    background: #ff641e;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    transition: 0.3s;
}

.read-more:hover {
    background: #e65312;
    transform: translateY(-2px);
}

.back-btn {
    display: inline-block;
    margin-bottom: 25px;
    color: #ff641e;
    text-decoration: none;
    font-weight: bold;
}

.single-post {
    background: #f8f9fc;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.single-post h1 {
    font-size: 36px;
    margin-bottom: 15px;
}

.single-post-meta {
    display: flex;
    gap: 20px;
    color: #777;
    font-size: 14px;
    margin-bottom: 25px;
}

.single-post-content {
    font-size: 17px;
    line-height: 1.9;
    white-space: pre-line;
}
   </style>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

    <div class="blogs">

        <a href="blog.html" class="back-btn">
            <i class="fa fa-arrow-left"></i>
            Back to Blog
        </a>

        <article id="singlePost" class="single-post">

            <p class="loading">
                Loading post...
            </p>

        </article>

    </div>


    <script type="module" src="./post.js"></script>

</body>
</html>
